# @package _global_
# Hydra configuration for TRUST-MCNet federated learning framework
# This file defines the default configuration composition

defaults:
  - dataset: iot_general
  - env: local
  - strategy: fedavg
  - trust: hybrid
  - model: mlp
  - training: default
  - ray: local
  - _self_

# Hydra configuration for experiment management
hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra:job.num}
  job:
    chdir: false

# Federated learning configuration
federated:
  num_rounds: 5
  fraction_fit: 0.8
  fraction_evaluate: 0.2
  min_fit_clients: 2
  min_evaluate_clients: 2
  min_available_clients: 2
  
  # Flower server configuration
  server:
    address: "0.0.0.0:8080"
    accept_failures: true
    
  # Trust-weighted strategy configuration
  trust_weighted:
    enable: true
    trim_ratio: 0.1  # 10% trimming for robust aggregation
  
  # Adaptive trust strategy configuration
  use_adaptive_strategy: false  # Set to true to enable adaptive thresholds
  target_accuracy: 0.85
  adaptation_rate: 0.05
  max_threshold: 0.9
  min_threshold: 0.3
  performance_window: 5
  adaptation_patience: 3
  
  # Real-time monitoring configuration
  enable_monitoring: false  # Set to true to enable trust dashboard
  dashboard_output_dir: "trust_dashboard"
  dashboard_update_interval: 30  # seconds

# Simulation configuration
simulation:
  use_legacy: false  # Use enhanced simulation by default (true for legacy)
  use_enhanced_client: true
  enable_trust_evaluation: true
  trust_threshold: 0.5
  enable_metrics_aggregation: true
  
  # Flower client simulation settings
  client_simulation:
    enable: false  # Enable simple client simulation for testing
    num_test_clients: 2
    server_address: "localhost:8080"
    client_bias_factor: 0.05  # Bias factor for trust evaluation testing

# Logging configuration
logging:
  level: INFO
  format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
  log_to_file: false
  log_file: null
  
  # Metrics logging
  metrics:
    enable_tensorboard: false
    tensorboard_dir: "logs/tensorboard"
    log_frequency: 1  # Log every N rounds
